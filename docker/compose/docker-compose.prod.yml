# Production Docker Compose
# Usage:
#   cd docker/compose
#   cp .env.prod.example .env.prod
#   nano .env.prod          # edit passwords and settings
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:

  # ── Database ──────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-paperless}
      - POSTGRES_PASSWORD=${DB_PASS:?DB_PASS must be set in .env.prod}
      - POSTGRES_DB=${DB_NAME:-paperless}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-paperless}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  # ── Message Broker ────────────────────────────────────────────────────────────
  broker:
    image: redis:8
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # ── Web Server ────────────────────────────────────────────────────────────────
  webserver:
    build:
      context: ../..        # project root
      dockerfile: docker/compose/Dockerfile.prod
    image: paperless-ngx-custom:latest
    restart: always
    entrypoint: ["/usr/local/bin/entrypoint-prod.sh"]
    depends_on:
      broker:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      # Granian listens on 8000 inside the container (see entrypoint-prod.sh);
      # PAPERLESS_PORT only chooses the published host port.
      - "${PAPERLESS_PORT:-8000}:8000"
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media
      - paperless_consume:/usr/src/paperless/consume
      - paperless_export:/usr/src/paperless/export
    environment:
      - DJANGO_SETTINGS_MODULE=paperless.settings
      - PAPERLESS_DBHOST=postgres
      - PAPERLESS_DBUSER=${DB_USER:-paperless}
      - PAPERLESS_DBPASS=${DB_PASS:?DB_PASS must be set in .env.prod}
      - PAPERLESS_DBNAME=${DB_NAME:-paperless}
      - PAPERLESS_REDIS=redis://broker:6379/0
      - PAPERLESS_DATA_DIR=/usr/src/paperless/data
      - PAPERLESS_MEDIA_ROOT=/usr/src/paperless/media
      - PAPERLESS_CONSUMPTION_DIR=/usr/src/paperless/consume
      - PAPERLESS_STATICDIR=/usr/src/paperless/static
      - PAPERLESS_EXPORT_DIR=/usr/src/paperless/export
      - PAPERLESS_SCRATCH_DIR=/usr/src/paperless/data/scratch
      - PAPERLESS_SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env.prod}
      - PAPERLESS_URL=${PAPERLESS_URL:-http://localhost:8083}
      - PAPERLESS_ALLOWED_HOSTS=${PAPERLESS_ALLOWED_HOSTS:-localhost,127.0.0.1}
      - PAPERLESS_CORS_ALLOWED_HOSTS=${PAPERLESS_URL:-http://localhost:8083}
      - PAPERLESS_CSRF_TRUSTED_ORIGINS=${PAPERLESS_URL:-http://localhost:8083}
      - PAPERLESS_OCR_LANGUAGE=ara+eng
      - PAPERLESS_OCR_LANGUAGES=ara
      - PAPERLESS_OCR_DESKEW=true
      - PAPERLESS_OCR_ROTATE_PAGES=true
      - PAPERLESS_OCR_ROTATE_PAGES_THRESHOLD=12.0
      - PAPERLESS_OCR_CLEAN=clean
      - PAPERLESS_OCR_OUTPUT_TYPE=pdfa
      - PAPERLESS_TIME_ZONE=${TZ:-Asia/Riyadh}
      - PAPERLESS_TIKA_ENABLED=1
      - PAPERLESS_TIKA_GOTENBERG_ENDPOINT=http://gotenberg:3000
      - PAPERLESS_TIKA_ENDPOINT=http://tika:9998
      - PAPERLESS_ADMIN_USER=${ADMIN_USER:-admin}
      - PAPERLESS_ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env.prod}
      - PAPERLESS_AI_ENABLED=${AI_ENABLED:-yes}
      - PAPERLESS_AI_LLM_BACKEND=${AI_BACKEND:-ollama}
      - PAPERLESS_AI_LLM_MODEL=${AI_MODEL:-gemma4:e4b}
      - PAPERLESS_AI_LLM_ENDPOINT=${AI_ENDPOINT:-http://host.docker.internal:11434}
      - PAPERLESS_AI_LLM_EMBEDDING_BACKEND=${AI_EMBEDDING_BACKEND:-huggingface}
      # Ollama tuning. These must be identical for every service that calls
      # Ollama: a different context size makes Ollama reload the model.
      - PAPERLESS_AI_LLM_TIMEOUT=${AI_TIMEOUT:-300}
      - PAPERLESS_AI_LLM_CONTEXT_WINDOW=${AI_CONTEXT_WINDOW:-8192}
      - PAPERLESS_AI_LLM_MAX_TOKENS=${AI_MAX_TOKENS:-1024}
      - PAPERLESS_AI_LLM_KEEP_ALIVE=${AI_KEEP_ALIVE:--1}
      - PAPERLESS_AI_LLM_THINKING=${AI_THINKING:-false}
      - PAPERLESS_AI_CHAT_MAX_CHARS=${AI_CHAT_MAX_CHARS:-8000}
      - PAPERLESS_AI_STREAM_THREADS=${AI_STREAM_THREADS:-4}
      - DEBUG=false
      - PAPERLESS_DEBUG=false
      - PAPERLESS_LOGGING_LEVEL=WARNING
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    # Allows containers to reach Ollama running on the Ubuntu host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true

  # ── Celery Worker ─────────────────────────────────────────────────────────────
  celery:
    image: paperless-ngx-custom:latest
    restart: always
    entrypoint: ["/usr/local/bin/entrypoint-celery.sh"]
    depends_on:
      broker:
        condition: service_healthy
      postgres:
        condition: service_healthy
      webserver:
        condition: service_healthy
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media
      - paperless_consume:/usr/src/paperless/consume
      - paperless_export:/usr/src/paperless/export
    environment:
      - DJANGO_SETTINGS_MODULE=paperless.settings
      - PAPERLESS_DBHOST=postgres
      - PAPERLESS_DBUSER=${DB_USER:-paperless}
      - PAPERLESS_DBPASS=${DB_PASS:?DB_PASS must be set in .env.prod}
      - PAPERLESS_DBNAME=${DB_NAME:-paperless}
      - PAPERLESS_REDIS=redis://broker:6379/0
      - PAPERLESS_DATA_DIR=/usr/src/paperless/data
      - PAPERLESS_MEDIA_ROOT=/usr/src/paperless/media
      - PAPERLESS_CONSUMPTION_DIR=/usr/src/paperless/consume
      - PAPERLESS_STATICDIR=/usr/src/paperless/static
      - PAPERLESS_EXPORT_DIR=/usr/src/paperless/export
      - PAPERLESS_SCRATCH_DIR=/usr/src/paperless/data/scratch
      - PAPERLESS_SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env.prod}
      - PAPERLESS_OCR_LANGUAGE=ara+eng
      - PAPERLESS_OCR_LANGUAGES=ara
      - PAPERLESS_OCR_DESKEW=true
      - PAPERLESS_OCR_ROTATE_PAGES=true
      - PAPERLESS_OCR_ROTATE_PAGES_THRESHOLD=12.0
      - PAPERLESS_OCR_CLEAN=clean
      - PAPERLESS_OCR_OUTPUT_TYPE=pdfa
      - PAPERLESS_TIME_ZONE=${TZ:-Asia/Riyadh}
      - PAPERLESS_TIKA_ENABLED=1
      - PAPERLESS_TIKA_GOTENBERG_ENDPOINT=http://gotenberg:3000
      - PAPERLESS_TIKA_ENDPOINT=http://tika:9998
      - PAPERLESS_AI_ENABLED=${AI_ENABLED:-yes}
      - PAPERLESS_AI_LLM_BACKEND=${AI_BACKEND:-ollama}
      - PAPERLESS_AI_LLM_MODEL=${AI_MODEL:-gemma4:e4b}
      - PAPERLESS_AI_LLM_ENDPOINT=${AI_ENDPOINT:-http://host.docker.internal:11434}
      - PAPERLESS_AI_LLM_EMBEDDING_BACKEND=${AI_EMBEDDING_BACKEND:-huggingface}
      # Ollama tuning. These must be identical for every service that calls
      # Ollama: a different context size makes Ollama reload the model.
      - PAPERLESS_AI_LLM_TIMEOUT=${AI_TIMEOUT:-300}
      - PAPERLESS_AI_LLM_CONTEXT_WINDOW=${AI_CONTEXT_WINDOW:-8192}
      - PAPERLESS_AI_LLM_MAX_TOKENS=${AI_MAX_TOKENS:-1024}
      - PAPERLESS_AI_LLM_KEEP_ALIVE=${AI_KEEP_ALIVE:--1}
      - PAPERLESS_AI_LLM_THINKING=${AI_THINKING:-false}
      - DEBUG=false
      - PAPERLESS_DEBUG=false
    # The image's built-in healthcheck curls the web port, which this container
    # never serves, so it would always report unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "grep -qa '[c]elery.*worker' /proc/[0-9]*/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true

  # ── Celery Beat (Scheduler) ───────────────────────────────────────────────────
  celery-beat:
    image: paperless-ngx-custom:latest
    restart: always
    entrypoint: ["/usr/local/bin/entrypoint-celery-beat.sh"]
    depends_on:
      broker:
        condition: service_healthy
      postgres:
        condition: service_healthy
      webserver:
        condition: service_healthy
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media
    environment:
      - DJANGO_SETTINGS_MODULE=paperless.settings
      - PAPERLESS_DBHOST=postgres
      - PAPERLESS_DBUSER=${DB_USER:-paperless}
      - PAPERLESS_DBPASS=${DB_PASS:?DB_PASS must be set in .env.prod}
      - PAPERLESS_DBNAME=${DB_NAME:-paperless}
      - PAPERLESS_REDIS=redis://broker:6379/0
      - PAPERLESS_DATA_DIR=/usr/src/paperless/data
      - PAPERLESS_MEDIA_ROOT=/usr/src/paperless/media
      - PAPERLESS_CONSUMPTION_DIR=/usr/src/paperless/consume
      - PAPERLESS_STATICDIR=/usr/src/paperless/static
      - PAPERLESS_EXPORT_DIR=/usr/src/paperless/export
      - PAPERLESS_SCRATCH_DIR=/usr/src/paperless/data/scratch
      - PAPERLESS_SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env.prod}
      - PAPERLESS_TIME_ZONE=${TZ:-Asia/Riyadh}
      - PAPERLESS_TIKA_ENABLED=1
      - PAPERLESS_TIKA_GOTENBERG_ENDPOINT=http://gotenberg:3000
      - PAPERLESS_TIKA_ENDPOINT=http://tika:9998
      - DEBUG=false
      - PAPERLESS_DEBUG=false
    healthcheck:
      test: ["CMD-SHELL", "grep -qa '[c]elery.*beat' /proc/[0-9]*/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true

  # ── Document Conversion ───────────────────────────────────────────────────────
  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.32
    restart: always
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    security_opt:
      - no-new-privileges:true

  tika:
    image: docker.io/apache/tika:3.2.2.0
    restart: always
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
  paperless_data:
  paperless_media:
  paperless_consume:
  paperless_export:

networks:
  default:
    name: paperless-prod
