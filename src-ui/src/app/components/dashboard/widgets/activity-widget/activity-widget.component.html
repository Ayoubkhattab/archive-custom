<pngx-widget-frame title="Activity &amp; progress" i18n-title [loading]="loading" [cardless]="false">
  <ng-container content>
    @if (loading) {
      <div class="placeholder-glow">
        <div class="placeholder w-100" style="height: 160px;"></div>
      </div>
    } @else {
      <div class="mb-4">
        <h6 class="small text-muted mb-2" i18n>Documents added &middot; last 14 days</h6>
        <div class="chart-container chart-trend">
          <canvas #trendCanvas></canvas>
        </div>
      </div>
      <div>
        <h6 class="small text-muted mb-2" i18n>Task activity &middot; last 30 days</h6>
        @if (totalTasksTracked > 0) {
          <div class="chart-container chart-tasks">
            <canvas #taskCanvas></canvas>
          </div>
        } @else {
          <pngx-empty-state icon="list-task" message="No task activity recorded yet." i18n-message></pngx-empty-state>
        }
      </div>
    }
  </ng-container>
</pngx-widget-frame>
