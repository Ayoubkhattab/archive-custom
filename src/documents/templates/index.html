<!doctype html>

{% load static i18n %}

<html lang="{{ frontend_language }}" dir="{{ text_direction }}" data-bs-theme="auto">
<head>
	<meta charset="utf-8">
	<title>أرشيف المعلومات</title>
	<base href="{% url 'base' %}">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="cookie_prefix" content="{{cookie_prefix}}">
	<meta name="robots" content="noindex,nofollow">
	<meta name="author" content="أرشيف المعلومات">
	<link rel="icon" type="image/x-icon" href="favicon.ico">
	<link rel="manifest" href="{% static webmanifest %}">
	<link rel="stylesheet" href="{% static styles_css %}">
	{% if text_direction == "rtl" %}{# Bootstrap ships a separate pre-flipped build; the id lets the frontend detect this link instead of adding a second one #}
	<link id="pngx-rtl-styles" rel="stylesheet" href="{% static rtl_styles_css %}">
	{% endif %}
	<link rel="apple-touch-icon" href="{% static apple_touch_icon %}">
</head>
<body>
	<pngx-root>
		<script type="text/javascript">
			setTimeout(() => {
				let warning = document.getElementsByClassName('warning').item(0)
				if (warning) {
					warning.classList.remove('hide')
					warning.classList.add('show')
				}
			}, 8000)
		</script>
		<style type="text/css">
			html, body {
				width: 100%;
				height: 100%;
				margin: 0;
			}

			/*
			 * The splash is shown before the Angular bundle — and with it
			 * Bootstrap — has loaded, so it cannot rely on utility classes to
			 * centre itself. Centring here is symmetric, so it is also correct
			 * in either writing direction.
			 */
			.app-loader-screen {
				display: flex;
				align-items: center;
				justify-content: center;
				width: 100%;
				height: 100%;
			}

			.app-loader {
				text-align: center;
			}

			.app-loader img.logo {
				display: block;
				margin: 0 auto 0.5rem;
			}

			.app-loader h6 {
				margin: 0;
				font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
			}

			@keyframes pulsate {
				0% {
					opacity: 0.1;
				}
				50% {
					opacity: 0.3;
				}
				100% {
					opacity: 0.1;
				}
			}

			.app-loader svg, .app-loader h6 {
				opacity: 0.1;
				animation: pulsate 2s ease-out;
				animation-iteration-count: infinite;
			}

			svg.logo .leaf {
				fill: var(--bs-body-color) !important;
			}
		</style>
		<div class="app-loader-screen bg-light">
			<div class="app-loader">
				<img src="{% static 'paperless/img/logo.jpg' %}" class="logo" height="96" alt="أرشيف المعلومات" />
				<h6>{% translate "أرشيف المعلومات جاري التحميل..." %}</h6>
			</div>
		</div>
		<script type="text/javascript">{# Pass Django messages to Angular frontend #}
			window.DJANGO_MESSAGES = [
				{% for message in messages %}
					{ level: "{{ message.level_tag | escapejs }}", message: "{{ message | escapejs }}" },
				{% endfor %}
			]
		</script>
	</pngx-root>
	<script src="{% static runtime_js %}" defer></script>
	<script src="{% static polyfills_js %}" defer></script>
	<script src="{% static main_js %}" defer></script>
</body>
</html>
